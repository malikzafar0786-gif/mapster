name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Creates the Android project, copies lib/main.dart,
      # adds packages and permissions (same script as local setup)
      - name: Set up project
        run: bash setup.sh

      - name: Build APK
        working-directory: map_overlay
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: map-overlay-apk
          path: map_overlay/build/app/outputs/flutter-apk/app-release.apk
